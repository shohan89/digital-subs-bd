name: Deploy to Cloudflare Workers

# Runs on every push to main, deploying independently of Cloudflare Workers Builds' own GitHub
# App integration — that integration's OAuth connection kept dropping (a Cloudflare/GitHub App
# authorization issue, not something fixable from CI config), so this workflow is the reliable
# path to "push to GitHub -> live on Cloudflare" instead. Uses the exact same build/deploy
# commands Cloudflare's own dashboard was configured with (see CLOUDFLARE_DEPLOYMENT.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time (see
      # CLOUDFLARE_DEPLOYMENT.md's "Environment variables" section on the build-time-vs-runtime
      # split) — hardcoded here rather than routed through a GitHub secret specifically because
      # they're the PUBLIC half of that split (see .env.example's own Public/Server-only/Secret
      # classification): the anon key and site URL are already visible to anyone in the deployed
      # site's browser bundle, so a repo secret would add process, not protection. Server-only
      # runtime secrets (SUPABASE_SERVICE_ROLE_KEY, etc.) are NOT needed here at all — they're
      # already configured directly on the live Cloudflare Worker (`wrangler secret put` /
      # dashboard) and persist across deploys regardless of what triggered them.
      - name: Build
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://zbgwdqipxbdlgdimpsui.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiZ3dkcWlweGJkbGdkaW1wc3VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDY1NjEsImV4cCI6MjEwMzQyMjU2MX0.4fZUbQhgrxsyFC2rn-mZndy9wNqkK8NDX8qypSABVEE
          NEXT_PUBLIC_SITE_URL: https://digitalsubsbd.maffin-killer007.workers.dev

      # CLOUDFLARE_API_TOKEN is the one thing this workflow needs from a human — GitHub Actions
      # secrets can only be created through GitHub's own UI/API by someone with write access to
      # this repo, not by an external agent. Add it once at
      # https://github.com/shohan89/digital-subs-bd/settings/secrets/actions ("New repository
      # secret", name it exactly CLOUDFLARE_API_TOKEN) and every push after that deploys with no
      # further action needed.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
